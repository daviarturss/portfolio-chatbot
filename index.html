<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title> | Portfolio | </title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}
#bg{pointer-events:none;transition:transform 0.2s ease-out}
section, header, footer, .box{background:rgba(80,80,80,0.65);backdrop-filter:blur(8px);border-radius:1rem;border:1px solid rgba(255,255,255,0.15)}
section{padding:1.5rem;margin:1rem auto;max-width:1120px}
header{position:sticky;top:0;z-index:40;padding:1rem;margin:1rem auto}
@media (min-width:768px){section{padding:2rem;margin:1.5rem auto}}
html.light body{background:#f5f5f7;color:#111}
html.light section, html.light header{background:rgba(255,255,255,0.85);border-color:rgba(0,0,0,0.15)}
html.light .text-gray-100, html.light .text-gray-300, html.light .text-gray-400{color:#222}
html.light a{color:#1e40af}
html.light .bg-white\/5, html.light .bg-white\/10{background:rgba(0,0,0,0.04)}
html.light .border-white\/10{border-color:rgba(0,0,0,0.12)}
html.light h1.bg-clip-text, html.light .font-bold.text-lg{ background:none !important; -webkit-background-clip:initial !important; color:#111 !important; -webkit-text-fill-color:#111 !important; }
</style>
</head>
<body class="text-gray-100 bg-black">
<img id="bg" src="3e4c9d81ba6be013081a1506dd7fcdec.gif" class="fixed inset-0 -z-10 w-full h-full object-cover opacity-80" alt="background"/>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const personalData = {
  nome: "Davi Artur Silva Sousa",
  idade: 24,
  local: "Recife – PE",
  telefone: "(81) 99219-2077",
  cargo: "Estudante de Análise e Desenvolvimento de Sistemas",
  formacao: "Análise e Desenvolvimento de Sistemas — Estácio, 2º período",
  ensinoMedio: "Ensino Médio Completo — ETE Porto Digital, 2018",
  experiencia: "Consultor de Vendas – Administrativo, Out 2025 – Mai 2026",
  areasDeInteresse: ["Desenvolvimento Web", "Suporte TI", "Administração e Processos"],
  especializacoes: "HTML, CSS, JavaScript, Python, React, Node.js, SQL, Git/GitHub e uso de IA para estudos e automação",
  bio: "Estudante de Análise e Desenvolvimento de Sistemas na Estácio, 2º período, com formação complementar na ETE Porto Digital. Atuo com HTML, CSS, JavaScript, Python, React, Node.js, SQL e Git/GitHub, e tenho experiência prática em processos administrativos, organização de planilhas e digitalização de documentos. Utilizo inteligência artificial como apoio aos estudos, pesquisa e automação no desenvolvimento de soluções.",
  sobre: "Sou uma pessoa proativa, organizada e com forte senso de responsabilidade. Valorizo o trabalho em equipe, a comunicação clara e a resolução de problemas com empatia e foco em resultados. Gosto de aprender continuamente, sou adaptável a mudanças e acredito na importância da qualidade, da documentação e das boas práticas. Meu objetivo é agregar valor ao ambiente de trabalho, contribuindo com comprometimento, iniciativa e uma atitude colaborativa.",
  habilidades: ["HTML","CSS","JavaScript","Python","React","Node.js","SQL","Git","GitHub"],
  contato: { github: "daviarturss", linkedin: "daviartur", email: "seu@email.com" }
};

const linkedinImages = [
  "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=800",
  "https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=800",
  "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800"
];

function App(){
  const [repos,setRepos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [chatOpen,setChatOpen]=useState(false);
  const [messages,setMessages]=useState([{role:'assistant',text:'Olá! Sou o assistente do Davi. Pergunte sobre formação, experiência ou projetos.'}]);
  const [input,setInput]=useState('');
  const [theme,setTheme]=useState(()=>{
    try{return localStorage.getItem('theme')||'dark'}catch{return 'dark'}
  });
  const [filterTech,setFilterTech]=useState('Todos');
  const [selectedRepo,setSelectedRepo]=useState(null);
  const [scrollProgress,setScrollProgress]=useState(0);
  const [jobDesc,setJobDesc]=useState('');
  const [jobPitch,setJobPitch]=useState('');
  const chatEndRef=useRef(null);
  const bgRef=useRef(null);
  useEffect(()=>{
    fetch(`https://api.github.com/users/${personalData.contato.github}/repos?per_page=6&sort=updated`)
      .then(r=>r.json()).then(d=>setRepos(Array.isArray(d)?d:[])).catch(()=>setRepos([])).finally(()=>setLoading(false));
  },[]);
  useEffect(()=>{
    try{localStorage.setItem('theme',theme)}catch{}
    document.documentElement.classList.toggle('light',theme==='light');
  },[theme]);
  useEffect(()=>{
    const onScroll=()=>{
      const h=document.documentElement.scrollHeight-window.innerHeight;
      const p = Math.min(100,Math.max(0,(window.scrollY/h)*100));
      setScrollProgress(p);
      const bg=document.getElementById('bg');
      if(bg){ bg.style.transform=`translateY(${window.scrollY*0.2}px)` }
    };
    window.addEventListener('scroll',onScroll);
    return ()=>window.removeEventListener('scroll',onScroll);
  },[]);
  useEffect(()=>{chatEndRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);
  useEffect(()=>{
    const canvas=document.getElementById('radarChart');
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    const labels=['Front-end','Back-end','DB','Infra','IA'];
    const values=[85,70,65,75,60];
    const size=300, center=size/2, radius=120;
    ctx.clearRect(0,0,size,size);
    ctx.strokeStyle='rgba(255,255,255,0.2)';
    ctx.lineWidth=1;
    for(let i=1;i<=5;i++){
      ctx.beginPath();
      for(let j=0;j<labels.length;j++){
        const angle=Math.PI*2*j/labels.length - Math.PI/2;
        const r=radius*i/5;
        const x=center+Math.cos(angle)*r;
        const y=center+Math.sin(angle)*r;
        if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.beginPath();
    labels.forEach((l,i)=>{
      const angle=Math.PI*2*i/labels.length - Math.PI/2;
      const r=radius*values[i]/100;
      const x=center+Math.cos(angle)*r;
      const y=center+Math.sin(angle)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle='rgba(59,130,246,0.3)';
    ctx.fill();
    ctx.strokeStyle='#3b82f6';
    ctx.lineWidth=2;
    ctx.stroke();
  },[]);
  const intents = [
    { patterns: [/idade|quantos anos|tem \d+ anos/], reply: () => `Tenho ${personalData.idade} anos.` },
    { patterns: [/quem (é|você|sou)|nome|apresent[ae]/], reply: () => `Olá! Sou ${personalData.nome}, ${personalData.cargo} de ${personalData.local}. Sou proativo, trabalho bem em equipe e busco aprendizado contínuo.` },
    { patterns: [/formação|estudo|faculdade|curso|universidade/], reply: () => `Estou cursando ${personalData.formacao}. ${personalData.ensinoMedio}. Tenho interesse em ${personalData.areasDeInteresse.join(', ')}.` },
    { patterns: [/experiência|trabalho|emprego|profissional|currículo/], reply: () => `Minha experiência mais recente é ${personalData.experiencia}, com foco em planilhas, digitalização, apoio administrativo e atendimento. Valorizo ambientes que permitam crescimento.` },
    { patterns: [/oportunidade|vaga|emprego|carreira|contratar|posso te contratar/], reply: () => `Estou aberto a oportunidades em ${personalData.areasDeInteresse.join(', ')}. Minhas especializações incluem ${personalData.especializacoes}, e busco aplicar conhecimentos técnicos aliado à organização e resolução de problemas.` },
    { patterns: [/habilidade|skill|tecnologia|sei|programo|linguagem/], reply: () => `Minhas principais habilidades:\n• ${personalData.habilidades.join('\n• ')} \n\nEspecializações: ${personalData.especializacoes}` },
    { patterns: [/local|mora|cidade|onde fica|recife/], reply: () => `Moro em ${personalData.local}.` },
    { patterns: [/projeto|github|repositório|repositorio|código/], reply: () => `Meus projetos estão em https://github.com/${personalData.contato.github}. Lá você encontra trabalhos com integração de dados e automação com IA.` },
    { patterns: [/sobre você|quem é você como pessoa|personalidade|qualidades/], reply: () => personalData.sobre },
    { patterns: [/contato|email|telefone|linkedin|instagram/], reply: () => `GitHub: https://github.com/${personalData.contato.github} | LinkedIn: https://linkedin.com/in/${personalData.contato.linkedin} | Tel: ${personalData.telefone}` },
    { patterns: [/obrigad|valeu|obrigado/], reply: () => ['De nada! 😊', 'Por nada!', 'Feliz em ajudar!'][Math.floor(Math.random()*3)] },
  ];
  const getAnswer = (q) => {
    const lower = q.toLowerCase();
    for (const i of intents) {
      if (i.patterns.some(p => p.test(lower))) return i.reply();
    }
    const fallbacks = [
      `${personalData.bio} Posso falar sobre formação, experiência, habilidades e áreas de interesse. O que você gostaria de saber?`,
      `Entendi. Quer saber sobre minha formação, experiência ou projetos no GitHub?`,
      `Não tenho certeza, mas posso te contar sobre ${personalData.areasDeInteresse[0]} ou minhas habilidades.`
    ];
    return fallbacks[Math.floor(Math.random()*fallbacks.length)];
  };
  const handleSend=(override)=>{
    const text = (override ?? input).trim();
    if(!text)return;
    const userMsg={role:'user',text};
    setMessages(m=>[...m,userMsg]);
    if(!override) setInput('');
    setMessages(m=>[...m,{role:'assistant',text:'Digitando...',typing:true}]);
    setTimeout(()=>{
      const answer = getAnswer(text);
      setMessages(m=>m.filter(msg=>!msg.typing).concat({role:'assistant',text:answer}));
    },600);
  };
  const getImg=(r)=>{
    const lang=(r.language||'').toLowerCase();
    const isWeb=['javascript','typescript','html','css'].some(k=>lang.includes(k)||r.name.toLowerCase().includes(k));
    const isPython=lang.includes('python');
    return isWeb?'https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800&auto=format':'https://images.unsplash.com/photo-1526379095098-d400fd0bf935?w=800&auto=format';
  };
  return (
    <div className="min-h-screen">
      <div className="fixed top-0 left-0 h-1 w-full z-[100] bg-transparent">
        <div className="h-full bg-blue-500 transition-all" style={{width:`${scrollProgress}%`}}/>
      </div>
      <header className="sticky top-0 z-40 backdrop-blur bg-[#0a0a0f]/70 border-b border-white/10">
        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
          <div className="font-bold text-lg">{personalData.nome}</div>
          <nav className="hidden md:flex gap-6 text-sm text-gray-300 items-center">
            <a href="#sobre" className="hover:text-white">Sobre</a>
            <a href="#formacao" className="hover:text-white">Formação</a>
            <a href="#projetos" className="hover:text-white">Projetos</a>
            <a href="#radar" className="hover:text-white">Habilidades</a>
            <a href="#pitch" className="hover:text-white">Pitch</a>
            <button onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} className="ml-4 px-3 py-1 rounded-full bg-white/10 text-sm">🌓</button>
            <a href="CurriculoDaviAdm2026.pdf" download className="ml-2 px-3 py-1 rounded-lg bg-white text-black text-xs font-medium">CV Adm</a>
            <a href="Curriculo_SuporteT.I.pdf" download className="ml-1 px-3 py-1 rounded-lg border border-white/20 text-xs">CV TI</a>
          </nav>
        </div>
      </header>

      <section className="max-w-6xl mx-auto px-6 py-20 grid md:grid-cols-2 gap-10 items-center">
        <div>
          <h1 className="text-5xl font-bold leading-tight bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">{personalData.nome}</h1>
          <p className="mt-4 text-xl text-gray-300">{personalData.cargo} • {personalData.local}</p>
          <p className="mt-4 text-gray-400">{personalData.bio}</p>
          <div className="mt-6 flex gap-3">
            <a href={`https://github.com/${personalData.contato.github}`} target="_blank" className="px-4 py-2 bg-white text-black rounded-lg font-medium">GitHub</a>
            <a href={`https://linkedin.com/in/${personalData.contato.linkedin}`} target="_blank" className="px-4 py-2 border border-white/20 rounded-lg">LinkedIn</a>
          </div>
        </div>
        <div className="rounded-3xl border border-white/10 p-6 bg-gradient-to-br from-white/5 to-transparent">
          <h3 className="font-semibold mb-3">Habilidades</h3>
          <div className="flex flex-wrap gap-2">{personalData.habilidades.map(h=> <span key={h} className="px-3 py-1 bg-white/10 rounded-full text-sm">{h}</span>)}</div>
        </div>
      </section>

      <section id="sobre" className="max-w-6xl mx-auto px-6 py-16">
        <h2 className="text-3xl font-bold mb-6">Sobre mim</h2>
        <p className="text-gray-300 leading-relaxed">{personalData.sobre}</p>
      </section>

      <section id="formacao" className="max-w-6xl mx-auto px-6 py-16 grid md:grid-cols-2 gap-8">
        <div className="p-6 rounded-2xl bg-white/5 border border-white/10">
          <h3 className="font-semibold mb-2">Formação</h3>
          <p>{personalData.formacao}</p>
          <p className="text-gray-400 text-sm mt-2">{personalData.ensinoMedio}</p>
        </div>
        <div className="p-6 rounded-2xl bg-white/5 border border-white/10">
          <h3 className="font-semibold mb-2">Experiência</h3>
          <p>{personalData.experiencia}</p>
          <p className="text-gray-400 text-sm mt-2">Planilhas, digitalização, apoio administrativo, atendimento e operação de sistema tintométrico.</p>
        </div>
      </section>

      <section id="radar" className="max-w-6xl mx-auto px-6 py-16">
        <h2 className="text-3xl font-bold mb-6">Radar de Habilidades</h2>
        <div className="grid md:grid-cols-2 gap-8 items-center">
          <div className="p-6 rounded-2xl bg-white/5 border border-white/10">
            <canvas id="radarChart" width="300" height="300"></canvas>
          </div>
          <div className="text-gray-300 space-y-2">
            <p>Front-end: 85</p>
            <p>Back-end: 70</p>
            <p>Banco de Dados: 65</p>
            <p>Infra/Suporte: 75</p>
            <p>IA/Automação: 60</p>
          </div>
        </div>
      </section>

      <section id="pitch" className="max-w-6xl mx-auto px-6 py-16">
        <h2 className="text-3xl font-bold mb-6">Gerar pitch para vaga</h2>
        <div className="p-6 rounded-2xl bg-white/5 border border-white/10">
          <textarea value={jobDesc} onChange={e=>setJobDesc(e.target.value)} placeholder="Cole a descrição da vaga aqui..." className="w-full h-32 bg-black/30 rounded-lg p-3 text-sm outline-none"/>
          <button onClick={()=>{
            const pitch = `Olá! Sou ${personalData.nome}, ${personalData.cargo} de ${personalData.local}. ${personalData.bio} Tenho experiência em ${personalData.especializacoes}. A vaga "${jobDesc.slice(0,80)}..." combina com meu interesse em ${personalData.areasDeInteresse.join(', ')} e posso agregar com proatividade, organização e uso de IA para automação.`;
            setJobPitch(pitch);
          }} className="mt-4 px-4 py-2 bg-blue-600 rounded-lg text-sm">Gerar pitch</button>
          {jobPitch && <div className="mt-4 p-4 bg-white/5 rounded-lg text-sm whitespace-pre-wrap">{jobPitch}</div>}
        </div>
      </section>

      <section id="projetos" className="max-w-6xl mx-auto px-6 py-16">
        <h2 className="text-3xl font-bold mb-6">Projetos GitHub</h2>
        <div className="flex flex-wrap gap-2 mb-6">
          {['Todos','JavaScript','Python','HTML','CSS','React','Node'].map(t=>(
            <button key={t} onClick={()=>setFilterTech(t)} className={`px-3 py-1 rounded-full text-xs border ${filterTech===t?'bg-blue-600 border-blue-600':'bg-white/10 border-white/20'}`}>{t}</button>
          ))}
        </div>
        <div className="grid md:grid-cols-3 gap-6">
          {loading? <p>Carregando...</p> : repos.filter(r=>{
            if(filterTech==='Todos') return true;
            const lang=(r.language||'').toLowerCase();
            return lang.includes(filterTech.toLowerCase())||r.name.toLowerCase().includes(filterTech.toLowerCase());
          }).map(r=>(
            <div key={r.id} onClick={()=>setSelectedRepo(r)} className="cursor-pointer rounded-2xl overflow-hidden border border-white/10 bg-white/5 hover:bg-white/10 transition">
              <img src={getImg(r)} className="w-full h-40 object-cover"/>
              <div className="p-4">
                <h4 className="font-semibold">{r.name}</h4>
                <p className="text-sm text-gray-400 line-clamp-2">{r.description}</p>
              </div>
            </div>
          ))}
        </div>
      </section>

      <section id="linkedin" className="max-w-6xl mx-auto px-6 py-16">
        <h2 className="text-3xl font-bold mb-6">Atividades LinkedIn</h2>
        <p className="text-gray-400 mb-6">Imagens recentes do seu perfil. Para sincronização automática, conecte a API do LinkedIn.</p>
        <div className="grid md:grid-cols-3 gap-6">
          {linkedinImages.map((src,i)=>(
            <div key={i} className="rounded-2xl overflow-hidden border border-white/10">
              <img src={src} className="w-full h-48 object-cover"/>
            </div>
          ))}
        </div>
      </section>

      {selectedRepo && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" onClick={()=>setSelectedRepo(null)}>
          <div className="bg-[#111] border border-white/10 rounded-2xl max-w-2xl w-full p-6" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-start">
              <h3 className="text-2xl font-bold">{selectedRepo.name}</h3>
              <button onClick={()=>setSelectedRepo(null)} className="text-gray-400 hover:text-white">✕</button>
            </div>
            <p className="text-gray-400 mt-2">{selectedRepo.description || 'Sem descrição.'}</p>
            <div className="mt-4 grid md:grid-cols-2 gap-4 text-sm">
              <div><strong>Problema:</strong> Demonstrar habilidades com {selectedRepo.language||'tecnologias'} e integração de dados.</div>
              <div><strong>Solução:</strong> Desenvolvimento com boas práticas, testes e documentação.</div>
              <div><strong>Tecnologias:</strong> {selectedRepo.language||'Variadas'}, Git, GitHub</div>
              <div><strong>Resultado:</strong> Repositório público, código reutilizável e aprendizado contínuo.</div>
            </div>
            <a href={selectedRepo.html_url} target="_blank" className="inline-block mt-6 px-4 py-2 bg-blue-600 rounded-lg">Abrir no GitHub</a>
          </div>
        </div>
      )}

      <button onClick={()=>setChatOpen(!chatOpen)} className="fixed bottom-6 right-4 z-50 px-4 py-3 rounded-full bg-blue-600 hover:bg-blue-500 shadow-lg font-medium text-sm">💬 Chat</button>
      {chatOpen && (
        <div className="fixed bottom-24 right-4 left-4 md:right-6 md:left-auto z-50 w-[90vw] md:w-[340px] h-[70vh] max-h-[460px] bg-[#111] border border-white/10 rounded-2xl shadow-2xl flex flex-col">
          <div className="p-4 border-b border-white/10 font-semibold">Chat sobre mim</div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {messages.map((m,i)=>(
              <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
                <div className={`max-w-[80%] px-3 py-2 rounded-lg text-sm ${m.role==='user'?'bg-blue-600':'bg-white/10'} ${m.typing?'italic opacity-70':''}`}>{m.text}{m.typing && '...'}</div>
              </div>
            ))}
            <div ref={chatEndRef}/>
          </div>
          <div className="px-3 pt-2 flex flex-wrap gap-2">
            {['Formação','Experiência','Projetos','Contato'].map(s=>(
              <button key={s} onClick={()=>handleSend(s)} className="text-xs px-2 py-1 rounded-full bg-white/10 hover:bg-white/20">{s}</button>
            ))}
          </div>
          <div className="p-3 border-t border-white/10 flex gap-2">
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder="Pergunte..." className="flex-1 bg-white/5 rounded-lg px-3 py-2 text-sm outline-none"/>
            <button onClick={handleSend} className="px-3 py-2 bg-blue-600 rounded-lg text-sm">Enviar</button>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
